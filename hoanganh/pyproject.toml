[project]
name = "sc4020"
version = "0.1.0"
description = "Clustering comparison on Wine, Breast Cancer and NYC Uber pickups"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "kagglehub>=0.3.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
